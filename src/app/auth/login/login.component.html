<div class="min-h-screen flex items-center justify-center bg-base-100 px-4">
  <div class="w-full max-w-md">
    <!-- Logo/Branding Section -->
    <div class="text-center mb-12">
      <h1 class="text-4xl font-bold text-base-content">UTS DPM</h1>
    </div>

    <!-- Login Form -->
    <div
      class="bg-base-200 rounded-2xl border border-neutral-200 dark:border-neutral-700 p-8 shadow-sm"
    >
      <h2 class="text-2xl font-semibold text-base-content mb-6">Sign In</h2>

      <form
        class="space-y-5"
        [formGroup]="loginFormGroup"
        (ngSubmit)="onSubmit()"
      >
        <div class="space-y-2">
          <label
            for="username"
            class="block text-sm font-medium text-base-content"
          >
            Username
          </label>
          <input
            id="username"
            type="email"
            class="w-full px-4 py-2.5 rounded-lg bg-base-100 border text-base-content placeholder:text-base-content/40 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-0"
            [ngClass]="{
              'border-neutral-200 dark:border-neutral-700 focus:border-primary-500 focus:ring-primary-500/20':
                !(hasErrors(username) || badCredentials()),
              'border-error-500 focus:border-error-500 focus:ring-error-500/20':
                hasErrors(username) || badCredentials(),
            }"
            placeholder="Enter your username"
            formControlName="username"
            (input)="onUserInput()"
          />
          @if (getUsernameValidationMessages()) {
            <p class="text-sm text-error-600 mt-1.5">
              {{ getUsernameValidationMessages() }}
            </p>
          }
        </div>

        <div class="space-y-2">
          <label
            for="password"
            class="block text-sm font-medium text-base-content"
          >
            Password
          </label>
          <input
            id="password"
            type="password"
            class="w-full px-4 py-2.5 rounded-lg bg-base-100 border text-base-content placeholder:text-base-content/40 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-0"
            [ngClass]="{
              'border-neutral-200 dark:border-neutral-700 focus:border-primary-500 focus:ring-primary-500/20':
                !(hasErrors(password) || badCredentials()),
              'border-error-500 focus:border-error-500 focus:ring-error-500/20':
                hasErrors(password) || badCredentials(),
            }"
            placeholder="Enter your password"
            formControlName="password"
            (input)="onUserInput()"
          />
          @if (getPasswordValidationMessages()) {
            <p class="text-sm text-error-600 mt-1.5">
              {{ getPasswordValidationMessages() }}
            </p>
          }
        </div>

        <button
          id="submitButton"
          type="submit"
          class="w-full mt-6 px-6 py-3 bg-primary-600 text-white font-medium rounded-lg transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2 focus:ring-offset-base-200 disabled:opacity-40 disabled:cursor-not-allowed disabled:pointer-events-none hover:bg-primary-700 active:scale-[0.98]"
          [disabled]="!loginFormGroup.valid || loading()"
        >
          @if (loading()) {
            <span class="inline-flex items-center gap-2">
              <svg
                class="animate-spin h-5 w-5"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
              >
                <circle
                  class="opacity-25"
                  cx="12"
                  cy="12"
                  r="10"
                  stroke="currentColor"
                  stroke-width="4"
                ></circle>
                <path
                  class="opacity-75"
                  fill="currentColor"
                  d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
                ></path>
              </svg>
              Signing in...
            </span>
          } @else {
            Sign In
          }
        </button>
      </form>
    </div>
  </div>
</div>
