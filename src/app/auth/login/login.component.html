<div
  class="min-h-screen flex items-center justify-center bg-base-100 px-4 py-12"
>
  <div class="w-full max-w-md">
    <div class="bg-base-200 rounded-lg shadow-[var(--shadow-lg)] p-8">
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-base-content mb-2">Welcome Back</h1>
        <p class="text-base-content/70">Sign in to your account</p>
      </div>

      <form
        class="space-y-6"
        [formGroup]="loginFormGroup"
        (ngSubmit)="onSubmit()"
      >
        <div class="space-y-2">
          <label
            for="username"
            class="block text-sm font-medium text-base-content"
          >
            Username
          </label>
          <input
            id="username"
            type="email"
            class="w-full px-4 py-3 rounded-md bg-base-100 border-2 text-base-content placeholder:text-base-content/50 transition-all duration-[var(--transition-base)] focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent"
            [ngClass]="{
              'border-neutral-300 hover:border-neutral-400': !(
                hasErrors(username) || badCredentials()
              ),
              'border-error-500 focus:ring-error-500':
                hasErrors(username) || badCredentials(),
            }"
            placeholder="Enter your username"
            formControlName="username"
            (input)="onUserInput()"
          />
          @if (getUsernameValidationMessages()) {
            <p class="text-sm text-error-600 mt-1">
              {{ getUsernameValidationMessages() }}
            </p>
          }
        </div>

        <div class="space-y-2">
          <label
            for="password"
            class="block text-sm font-medium text-base-content"
          >
            Password
          </label>
          <input
            id="password"
            type="password"
            class="w-full px-4 py-3 rounded-md bg-base-100 border-2 text-base-content placeholder:text-base-content/50 transition-all duration-[var(--transition-base)] focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent"
            [ngClass]="{
              'border-neutral-300 hover:border-neutral-400': !(
                hasErrors(password) || badCredentials()
              ),
              'border-error-500 focus:ring-error-500':
                hasErrors(password) || badCredentials(),
            }"
            placeholder="Enter your password"
            formControlName="password"
            (input)="onUserInput()"
          />
          @if (getPasswordValidationMessages()) {
            <p class="text-sm text-error-600 mt-1">
              {{ getPasswordValidationMessages() }}
            </p>
          }
        </div>

        <button
          id="submitButton"
          type="submit"
          class="w-full px-6 py-3 bg-primary-600 text-white font-medium rounded-md shadow-[var(--shadow-sm)] hover:shadow-[var(--shadow-md)] hover:bg-primary-700 active:bg-primary-800 transition-all duration-[var(--transition-base)] focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed disabled:pointer-events-none"
          [disabled]="!loginFormGroup.valid || loading()"
        >
          @if (loading()) {
            <span class="inline-flex items-center gap-2">
              <svg
                class="animate-spin h-5 w-5"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
              >
                <circle
                  class="opacity-25"
                  cx="12"
                  cy="12"
                  r="10"
                  stroke="currentColor"
                  stroke-width="4"
                ></circle>
                <path
                  class="opacity-75"
                  fill="currentColor"
                  d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
                ></path>
              </svg>
              Signing in...
            </span>
          } @else {
            Sign In
          }
        </button>
      </form>
    </div>
  </div>
</div>
