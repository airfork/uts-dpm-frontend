<div
  class="min-h-screen flex items-center justify-center bg-gradient-to-br from-base-100 to-base-200 px-4"
>
  <div class="w-full max-w-md">
    <!-- Logo/Branding Section -->
    <div class="text-center mb-8">
      <div
        class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-gradient-to-br from-primary-500 to-primary-600 flex items-center justify-center shadow-lg shadow-primary-500/25"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-8 h-8 text-white"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="1.5"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M8 4h8a4 4 0 014 4v8a2 2 0 01-2 2h-1l-1 2H8l-1-2H6a2 2 0 01-2-2V8a4 4 0 014-4z"
          />
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M6 12h12M8 8h.01M16 8h.01M8 16h.01M16 16h.01"
          />
        </svg>
      </div>
      <h1 class="text-3xl font-bold text-base-content">UTS DPM</h1>
    </div>

    <!-- Login Form -->
    <div
      class="bg-base-100 rounded-2xl border border-neutral-200 dark:border-neutral-700 p-8 shadow-xl"
    >
      <h2 class="text-xl font-semibold text-base-content mb-6">Sign in to your account</h2>

      <form class="space-y-5" [formGroup]="loginFormGroup" (ngSubmit)="onSubmit()">
        <div class="space-y-2">
          <label
            for="username"
            class="block text-xs font-medium text-primary-600 dark:text-primary-400 uppercase tracking-wide"
          >
            Username
          </label>
          <input
            id="username"
            type="email"
            class="w-full px-4 py-3 rounded-lg bg-base-200 border text-base-content placeholder:text-base-content/40 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-0"
            [ngClass]="{
              'border-neutral-200 dark:border-neutral-700 focus:border-primary-500 focus:ring-primary-500/20 focus:bg-primary-50/50 dark:focus:bg-primary-900/10':
                !(hasErrors(username) || badCredentials()),
              'border-error-500 focus:border-error-500 focus:ring-error-500/20 bg-error-50/50 dark:bg-error-900/10':
                hasErrors(username) || badCredentials(),
            }"
            [attr.aria-describedby]="getUsernameValidationMessages() ? 'username-error' : null"
            placeholder="Enter your username"
            formControlName="username"
            (input)="onUserInput()"
          />
          @if (getUsernameValidationMessages()) {
            <p id="username-error" class="text-sm text-error-600 font-medium mt-1.5">
              {{ getUsernameValidationMessages() }}
            </p>
          }
        </div>

        <div class="space-y-2">
          <label
            for="password"
            class="block text-xs font-medium text-primary-600 dark:text-primary-400 uppercase tracking-wide"
          >
            Password
          </label>
          <div class="relative">
            <input
              id="password"
              [type]="showPassword() ? 'text' : 'password'"
              class="w-full px-4 py-3 pr-12 rounded-lg bg-base-200 border text-base-content placeholder:text-base-content/40 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-0"
              [ngClass]="{
                'border-neutral-200 dark:border-neutral-700 focus:border-primary-500 focus:ring-primary-500/20 focus:bg-primary-50/50 dark:focus:bg-primary-900/10':
                  !(hasErrors(password) || badCredentials()),
                'border-error-500 focus:border-error-500 focus:ring-error-500/20 bg-error-50/50 dark:bg-error-900/10':
                  hasErrors(password) || badCredentials(),
              }"
              [attr.aria-describedby]="getPasswordValidationMessages() ? 'password-error' : null"
              placeholder="Enter your password"
              formControlName="password"
              (input)="onUserInput()"
            />
            <button
              type="button"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-base-content/40 hover:text-base-content transition-colors cursor-pointer"
              (click)="showPassword.set(!showPassword())"
              aria-label="Toggle password visibility"
            >
              <i [class]="showPassword() ? 'pi pi-eye-slash' : 'pi pi-eye'"></i>
            </button>
          </div>
          @if (getPasswordValidationMessages()) {
            <p id="password-error" class="text-sm text-error-600 font-medium mt-1.5">
              {{ getPasswordValidationMessages() }}
            </p>
          }
        </div>

        @if (badCredentials()) {
          <div
            class="rounded-lg bg-error-50 dark:bg-error-900/20 border border-error-200 dark:border-error-800 p-4"
          >
            <p
              class="text-sm text-error-600 dark:text-error-400 font-medium flex items-center gap-2"
            >
              <i class="pi pi-exclamation-circle"></i>
              Username and/or password is incorrect
            </p>
          </div>
        }

        <button
          id="submitButton"
          type="submit"
          class="w-full mt-6 px-6 py-3.5 bg-gradient-to-r from-primary-600 to-primary-500 text-white font-semibold rounded-lg shadow-lg shadow-primary-500/25 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2 focus:ring-offset-base-100 disabled:opacity-40 disabled:cursor-not-allowed disabled:shadow-none hover:from-primary-700 hover:to-primary-600 hover:shadow-xl hover:shadow-primary-500/30 active:scale-[0.98] cursor-pointer"
          [disabled]="!loginFormGroup.valid || loading()"
        >
          @if (loading()) {
            <span class="inline-flex items-center gap-2">
              <svg
                class="animate-spin h-5 w-5"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
              >
                <circle
                  class="opacity-25"
                  cx="12"
                  cy="12"
                  r="10"
                  stroke="currentColor"
                  stroke-width="4"
                ></circle>
                <path
                  class="opacity-75"
                  fill="currentColor"
                  d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
                ></path>
              </svg>
              Signing in...
            </span>
          } @else {
            Sign In
          }
        </button>
      </form>
    </div>
  </div>
</div>
