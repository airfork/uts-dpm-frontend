@let active = activeTab();
<div
  role="tablist"
  class="mb-6 flex justify-center lg:justify-start border-b-2 border-neutral-300"
  [appRemoveIfUnauthorized]="editRoles"
>
  <div class="flex gap-1">
    <button
      role="tab"
      type="button"
      class="px-6 py-3 font-medium text-base transition-all duration-[var(--transition-base)] border-b-2 -mb-[2px] cursor-pointer"
      [ngClass]="{
        'border-primary-600 text-primary-600': active.new,
        'border-transparent text-base-content/60 hover:text-base-content hover:border-neutral-400':
          !active.new,
      }"
      (click)="activateTab('new')"
    >
      New
    </button>
    <button
      role="tab"
      type="button"
      class="px-6 py-3 font-medium text-base transition-all duration-[var(--transition-base)] border-b-2 -mb-[2px] cursor-pointer"
      [ngClass]="{
        'border-primary-600 text-primary-600': active.edit,
        'border-transparent text-base-content/60 hover:text-base-content hover:border-neutral-400':
          !active.edit,
      }"
      (click)="activateTab('edit')"
    >
      Edit
    </button>
  </div>
</div>

<app-new-dpm
  [dpmGroups]="dpmGroups()"
  [isGroupsLoaded]="isGroupsLoaded()"
  [driverNames]="driverNames()"
  [homeFormGroup]="homeFormGroup"
  [hidden]="!active.new"
></app-new-dpm>

@if (isAdmin()) {
  <app-edit-dpms
    [(dpmGroupsNeedRefresh)]="groupsNeedRefresh"
    [dpmGroupsInput]="dpmGroups()"
    [hidden]="!active.edit"
  ></app-edit-dpms>
}
