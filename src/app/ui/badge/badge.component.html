<span [class]="classes()">
  @if (showIcon() && iconPath()) {
    <svg
      class="w-3 h-3"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path [attr.d]="iconPath()"></path>
    </svg>
  }
  <ng-content></ng-content>
</span>
