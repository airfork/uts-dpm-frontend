<div
  class="border border-neutral-200 dark:border-neutral-700 rounded-lg overflow-hidden"
>
  <!-- Header (always visible, clickable) -->
  <button
    type="button"
    class="w-full flex items-center justify-between p-4 bg-base-100 hover:bg-primary-50/50 dark:hover:bg-primary-900/10 transition-colors cursor-pointer text-left"
    [class]="headerClass()"
    (click)="toggle()"
  >
    <div class="flex-1">
      @if (headerTemplate) {
        <ng-container *ngTemplateOutlet="headerTemplate"></ng-container>
      } @else {
        <ng-content select="[collapsible-header]"></ng-content>
      }
    </div>
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="h-5 w-5 text-base-content/60 transition-transform duration-200"
      [class.rotate-180]="!isCollapsed()"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="2"
    >
      <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
    </svg>
  </button>

  <!-- Content (collapsible) -->
  @if (!isCollapsed()) {
    <div
      class="p-4 border-t border-neutral-200 dark:border-neutral-700 bg-base-100"
      [class]="contentClass()"
    >
      <ng-content></ng-content>
    </div>
  }
</div>
