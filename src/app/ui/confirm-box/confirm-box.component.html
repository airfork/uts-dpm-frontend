<dialog #confirmModal class="modal cursor-default">
  <div class="modal-box relative shadow-xl p-6">
    <h3 class="text-xl font-semibold mb-4">{{ title() }}</h3>
    <p class="py-4 text-base">{{ message() }}</p>
    <div class="modal-action mt-6">
      <button pRipple class="btn btn-outline btn-success" (click)="confirm()">
        Yes
      </button>
      <button
        pRipple
        class="btn btn-outline btn-error"
        (click)="requestClose()"
      >
        No
      </button>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button id="dialogCloseButton" (click)="requestClose()">close</button>
  </form>
</dialog>
