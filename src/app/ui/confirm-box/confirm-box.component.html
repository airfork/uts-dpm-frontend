<app-modal [open]="isOpen()" [size]="'sm'" (close)="requestClose()">
  <h3 modal-header class="text-xl font-semibold">{{ title() }}</h3>
  <div modal-body>
    <p class="text-base">{{ message() }}</p>
  </div>
  <div modal-footer class="flex justify-end gap-2">
    <app-button variant="outline" (click)="confirm()"> Yes </app-button>
    <app-button variant="ghost" (click)="requestClose()"> No </app-button>
  </div>
</app-modal>
