<div class="relative date-picker-container">
  <!-- Input with calendar icon -->
  <div class="relative">
    <input
      #inputRef
      type="text"
      [id]="inputId()"
      [placeholder]="placeholder()"
      [value]="inputValue()"
      [disabled]="disabled"
      [class]="
        'w-full px-4 py-2.5 pr-10 rounded-lg bg-base-100 border text-base-content placeholder:text-base-content/40 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-0 cursor-pointer ' +
        inputClass()
      "
      autocomplete="off"
      (input)="onInputChange($event)"
      (blur)="onInputBlur()"
      (click)="toggleCalendar()"
    />
    <button
      type="button"
      class="absolute right-3 top-1/2 -translate-y-1/2 text-base-content/50 hover:text-base-content transition-colors cursor-pointer"
      (click)="toggleCalendar()"
      [disabled]="disabled"
      tabindex="-1"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-5 w-5"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="1.5"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
        />
      </svg>
    </button>
  </div>

  <!-- Calendar dropdown -->
  @if (isOpen()) {
    <div
      class="absolute z-50 mt-1 bg-base-200 border border-neutral-200 dark:border-neutral-700 rounded-xl shadow-lg p-4 w-72"
    >
      <!-- Header with month/year navigation -->
      <div class="flex items-center justify-between mb-4">
        <button
          type="button"
          class="p-1.5 rounded-lg hover:bg-primary-100 dark:hover:bg-primary-900/30 transition-colors cursor-pointer"
          (click)="prevMonth()"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5 text-base-content"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
          </svg>
        </button>

        <button
          type="button"
          class="font-semibold text-base-content hover:text-primary-600 transition-colors cursor-pointer"
          (click)="toggleYearPicker()"
        >
          {{ currentMonth() }} {{ currentYear() }}
        </button>

        <button
          type="button"
          class="p-1.5 rounded-lg hover:bg-primary-100 dark:hover:bg-primary-900/30 transition-colors cursor-pointer"
          (click)="nextMonth()"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5 text-base-content"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
          </svg>
        </button>
      </div>

      @if (showYearPicker()) {
        <!-- Year picker -->
        <div class="max-h-48 overflow-auto grid grid-cols-4 gap-1 mb-4">
          @for (year of years(); track year) {
            <button
              type="button"
              class="py-1.5 text-sm rounded-lg transition-colors cursor-pointer"
              [class]="
                year === +currentYear()
                  ? 'bg-primary-500 text-white font-semibold'
                  : 'hover:bg-primary-100 dark:hover:bg-primary-900/30 text-base-content'
              "
              (click)="selectYear(year)"
            >
              {{ year }}
            </button>
          }
        </div>
      } @else {
        <!-- Weekday headers -->
        <div class="grid grid-cols-7 gap-1 mb-2">
          @for (day of weekDays; track day) {
            <div class="text-center text-xs font-medium text-base-content/60 py-1">
              {{ day }}
            </div>
          }
        </div>

        <!-- Calendar days -->
        <div class="grid grid-cols-7 gap-1">
          @for (day of calendarDays(); track day.date.getTime()) {
            <button
              type="button"
              class="w-9 h-9 text-sm rounded-lg transition-colors cursor-pointer"
              [class]="
                day.isSelected
                  ? 'bg-primary-500 text-white font-semibold'
                  : day.isToday
                    ? 'border-2 border-primary-500 text-primary-600 font-semibold'
                    : day.isCurrentMonth
                      ? 'text-base-content hover:bg-primary-100 dark:hover:bg-primary-900/30'
                      : 'text-base-content/30'
              "
              [class.cursor-not-allowed]="isDateDisabled(day.date)"
              [class.opacity-40]="isDateDisabled(day.date)"
              [disabled]="isDateDisabled(day.date)"
              (click)="selectDate(day.date)"
            >
              {{ day.date.getDate() }}
            </button>
          }
        </div>
      }

      <!-- Today button -->
      <div class="mt-4 pt-3 border-t border-neutral-200 dark:border-neutral-700">
        <button
          type="button"
          class="w-full py-2 text-sm font-medium text-primary-600 hover:bg-primary-100 dark:hover:bg-primary-900/30 rounded-lg transition-colors cursor-pointer"
          (click)="selectToday()"
        >
          Today
        </button>
      </div>
    </div>
  }
</div>
