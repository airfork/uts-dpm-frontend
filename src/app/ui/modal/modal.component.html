@if (open()) {
  <!-- Backdrop -->
  <div
    class="fixed inset-0 z-50 bg-black/50 transition-opacity duration-[var(--transition-base)]"
    (click)="handleBackdropClick()"
    aria-hidden="true"
  >
    <!-- Modal Container -->
    <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
      <div
        [class]="classes()"
        (click)="$event.stopPropagation()"
        role="dialog"
        aria-modal="true"
      >
        <!-- Header -->
        <div
          class="flex items-start justify-between border-b border-neutral-200 px-6 py-4"
        >
          <div class="flex-1">
            <ng-content select="[modal-header]"></ng-content>
          </div>
          <button
            type="button"
            (click)="handleClose()"
            class="ml-4 text-neutral-400 hover:text-neutral-600 transition-colors duration-[var(--transition-base)] focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2 rounded"
            aria-label="Close modal"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              ></path>
            </svg>
          </button>
        </div>

        <!-- Body -->
        <div class="px-6 py-4">
          <ng-content select="[modal-body]"></ng-content>
        </div>

        <!-- Footer -->
        <div class="border-t border-neutral-200 px-6 py-4">
          <ng-content select="[modal-footer]"></ng-content>
        </div>
      </div>
    </div>
  </div>
}
