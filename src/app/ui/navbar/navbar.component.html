<nav
  class="sticky top-0 z-40 bg-gradient-to-r from-primary-600 to-primary-500 shadow-lg shadow-primary-500/20"
>
  <div class="flex items-center justify-between h-16 px-4 md:px-8 lg:px-12">
    <!-- Left side: Mobile menu + Logo -->
    <div class="flex items-center gap-3">
      <!-- Mobile menu button -->
      <div class="relative lg:hidden">
        <button
          type="button"
          id="menuButton"
          [tabindex]="0"
          (click)="toggleDropdown()"
          class="p-2 rounded-lg bg-white/10 text-white hover:bg-white/20 transition-colors cursor-pointer"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            @if (!isDropdownOpen()) {
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6h16M4 12h8m-8 6h16"
              />
            }
            @if (isDropdownOpen()) {
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              />
            }
          </svg>
        </button>

        <!-- Mobile dropdown menu -->
        @if (isDropdownOpen()) {
          <div
            class="absolute left-0 top-full mt-2 w-56 rounded-xl bg-primary-700/95 backdrop-blur-lg border border-white/20 shadow-xl overflow-hidden z-50"
          >
            <div class="py-2">
              @for (link of links; track link) {
                <div *appAuthorized="link.allowedRoles">
                  @if (link.path) {
                    <a
                      routerLink="{{ link.path }}"
                      routerLinkActive="!bg-white/20 !text-white !font-semibold"
                      (click)="menuItemClick()"
                      class="block px-4 py-3 text-sm font-medium text-white/80 hover:text-white hover:bg-white/10 transition-colors"
                    >
                      {{ link.name }}
                    </a>
                  }
                  @if (!link.path) {
                    <div class="border-t border-white/20 mt-2 pt-2">
                      <button
                        type="button"
                        (click)="logoutClick(); menuItemClick()"
                        class="block w-full text-left px-4 py-3 text-sm font-medium text-white/80 hover:text-white hover:bg-white/10 transition-colors cursor-pointer"
                      >
                        {{ link.name }}
                      </button>
                    </div>
                  }
                </div>
              }
            </div>
          </div>
        }
      </div>

      <!-- Logo / Home button -->
      <a
        routerLink="/"
        class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-white font-bold text-xl hover:bg-white/10 transition-colors"
      >
        <div class="w-8 h-8 rounded-lg bg-white/20 flex items-center justify-center">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-5 h-5 text-white"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="1.5"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M8 4h8a4 4 0 014 4v8a2 2 0 01-2 2h-1l-1 2H8l-1-2H6a2 2 0 01-2-2V8a4 4 0 014-4z"
            />
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M6 12h12M8 8h.01M16 8h.01M8 16h.01M16 16h.01"
            />
          </svg>
        </div>
        <span class="hidden sm:inline">UTS DPM</span>
      </a>
    </div>

    <!-- Right side: Desktop nav links + Theme switcher -->
    <div class="hidden lg:flex items-center gap-1">
      @for (link of links; track link) {
        <div *appAuthorized="link.allowedRoles">
          @if (link.path) {
            <a
              routerLink="{{ link.path }}"
              routerLinkActive="!bg-white/20 !text-white !font-semibold"
              [routerLinkActiveOptions]="{ exact: link.path === '/' }"
              class="px-4 py-2 rounded-lg text-sm font-medium text-white/80 hover:text-white hover:bg-white/10 transition-all"
            >
              {{ link.name }}
            </a>
          }
          @if (!link.path) {
            <button
              type="button"
              (click)="logoutClick()"
              class="ml-2 px-4 py-2 rounded-lg text-sm font-medium text-white/80 hover:text-white hover:bg-white/10 transition-all cursor-pointer"
            >
              {{ link.name }}
            </button>
          }
        </div>
      }

      <!-- Theme toggle button -->
      <button
        type="button"
        (click)="toggleTheme()"
        class="ml-2 p-2 rounded-lg text-white/80 hover:text-white hover:bg-white/10 transition-colors cursor-pointer"
        [attr.aria-label]="
          currentTheme() === 'light' ? 'Switch to dark mode' : 'Switch to light mode'
        "
      >
        @if (currentTheme() === 'light') {
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
            />
          </svg>
        }
        @if (currentTheme() === 'dark') {
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
            />
          </svg>
        }
      </button>
    </div>
  </div>
</nav>
