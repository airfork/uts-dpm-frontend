<nav
  class="flex items-center justify-between bg-base-100 h-16 px-4 md:px-8 lg:px-12"
>
  <div class="flex items-center gap-4 w-[40%]">
    <div class="relative">
      <app-button
        id="menuButton"
        [tabindex]="0"
        variant="ghost"
        size="sm"
        class="lg:hidden px-2"
        (click)="toggleDropdown()"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-5 w-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6h16M4 12h8m-8 6h16"
          />
        </svg>
      </app-button>

      @if (isDropdownOpen()) {
        <ul
          tabindex="0"
          class="flex flex-col gap-0 absolute left-0 top-full mt-3 p-4 shadow-[var(--shadow-md)] bg-base-100 rounded-lg w-52 z-50"
        >
          @for (link of links; track link) {
            <li
              [appRemoveIfUnauthorized]="link.allowedRoles"
              class="mb-2 last:mb-0"
            >
              @if (link.path) {
                <a
                  routerLink="{{ link.path }}"
                  routerLinkActive="bg-primary-600 text-white"
                  [queryParamsHandling]="
                    link.name === 'Users' ? 'preserve' : null
                  "
                  (click)="menuItemClick()"
                  class="block px-4 py-3 rounded-lg text-sm font-medium transition-all duration-200 cursor-pointer hover:bg-base-300/50 text-base-content/80 hover:text-base-content w-full text-left"
                >
                  {{ link.name }}
                </a>
              }
              @if (!link.path) {
                <button
                  type="button"
                  (click)="logoutClick(); menuItemClick()"
                  class="block px-4 py-3 rounded-lg text-sm font-medium transition-all duration-200 cursor-pointer hover:bg-base-300/50 text-base-content/80 hover:text-base-content w-full text-left"
                >
                  {{ link.name }}
                </button>
              }
            </li>
          }
        </ul>
      }
    </div>

    <app-button
      routerLink="/"
      variant="ghost"
      size="lg"
      class="normal-case text-2xl font-bold"
    >
      UTS DPM
    </app-button>
  </div>

  <div class="flex items-center justify-end gap-2 w-[60%] hidden lg:flex">
    <ul class="flex flex-row items-center p-0 gap-1">
      @for (link of links; track link) {
        <li [appRemoveIfUnauthorized]="link.allowedRoles">
          @if (link.path) {
            <a
              routerLink="{{ link.path }}"
              routerLinkActive="bg-primary-600 text-white"
              [queryParamsHandling]="link.name === 'Users' ? 'preserve' : null"
              class="px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200 cursor-pointer hover:bg-base-300/50 text-base-content/80 hover:text-base-content"
            >
              {{ link.name }}
            </a>
          }
          @if (!link.path) {
            <button
              type="button"
              (click)="logoutClick()"
              class="px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200 cursor-pointer hover:bg-base-300/50 text-base-content/80 hover:text-base-content"
            >
              {{ link.name }}
            </button>
          }
        </li>
      }
    </ul>
  </div>
</nav>
