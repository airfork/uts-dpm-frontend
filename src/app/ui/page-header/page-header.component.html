<div class="flex items-center gap-3 mb-6">
  <div [class]="iconClasses()">
    <i [class]="'pi ' + icon() + ' text-lg text-white'"></i>
  </div>
  <div>
    <h2 class="text-2xl font-bold text-base-content">{{ title() }}</h2>
    @if (subtitle()) {
      <p class="text-sm text-base-content/60">
        {{ subtitle() }}
      </p>
    }
  </div>
</div>
