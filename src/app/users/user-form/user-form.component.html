<div class="p-6">
  <form
    class="grid grid-cols-3 gap-x-6 gap-y-6 rounded"
    [formGroup]="userFormGroup"
    (ngSubmit)="onSubmit()"
  >
    <fieldset class="fieldset col-span-3 md:col-span-1">
      <legend
        class="fieldset-legend text-sm font-medium mb-2 {{
          setStatusClass(email, false)
        }}"
      >
        Email
      </legend>
      <input
        id="userEmail"
        type="text"
        placeholder="Email"
        class="input w-full text-base {{ setStatusClass(email) }}"
        formControlName="email"
        autocomplete="off"
        required
        aria-required="true"
        [attr.aria-describedby]="hasErrors(email) ? 'userEmail-error' : null"
      />
      <p id="userEmail-error" class="text-sm text-error-600 mt-1">
        {{ getEmailValidationMessages() }}
      </p>
    </fieldset>

    <fieldset class="fieldset col-span-3 md:col-span-1">
      <legend
        class="fieldset-legend text-sm font-medium mb-2 {{
          setStatusClass(firstname, false)
        }}"
      >
        First Name
      </legend>
      <input
        id="firstname"
        type="text"
        placeholder="Jane"
        class="input w-full text-base capitalize {{
          setStatusClass(firstname)
        }}"
        formControlName="firstname"
        autocomplete="off"
        required
        aria-required="true"
        [attr.aria-describedby]="
          hasErrors(firstname) ? 'firstname-error' : null
        "
      />
      <p id="firstname-error" class="text-sm text-error-600 mt-1">
        {{ getFirstnameValidationMessages() }}
      </p>
    </fieldset>

    <fieldset class="fieldset col-span-3 md:col-span-1">
      <legend
        class="fieldset-legend text-sm font-medium mb-2 {{
          setStatusClass(lastname, false)
        }}"
      >
        Last Name
      </legend>
      <input
        id="lastname"
        type="text"
        placeholder="Doe"
        class="input w-full text-base capitalize {{ setStatusClass(lastname) }}"
        formControlName="lastname"
        autocomplete="off"
        required
        aria-required="true"
        [attr.aria-describedby]="hasErrors(lastname) ? 'lastname-error' : null"
      />
      <p id="lastname-error" class="text-sm text-error-600 mt-1">
        {{ getLastnameValidationMessages() }}
      </p>
    </fieldset>

    @if (layout === "edit") {
      <fieldset class="fieldset col-span-3 md:col-span-1">
        <legend
          class="fieldset-legend text-sm font-medium mb-2"
          [ngClass]="{ 'text-error': hasErrors(points) }"
        >
          Points
        </legend>
        <input
          id="points"
          type="text"
          placeholder="0"
          class="input w-full text-base"
          formControlName="points"
          autocomplete="off"
          required
          aria-required="true"
          [attr.aria-describedby]="hasErrors(points) ? 'points-error' : null"
          [ngClass]="{ 'input-error': hasErrors(points) }"
        />
        <p id="points-error" class="text-sm text-error-600 mt-1">
          {{ getPointsValidationMessages() }}
        </p>
      </fieldset>
    }

    <fieldset class="fieldset col-span-3 md:col-span-1">
      <legend class="fieldset-legend text-sm font-medium mb-2">Manager</legend>
      <select
        id="manager-select"
        class="select select-bordered w-full text-base"
        formControlName="manager"
      >
        @for (manager of managers; track manager) {
          <option [value]="manager">
            {{ manager }}
          </option>
        }
      </select>
    </fieldset>

    <fieldset class="fieldset col-span-3 md:col-span-1">
      <legend class="fieldset-legend text-sm font-medium mb-2">Role</legend>
      <select
        id="role-select"
        class="select select-bordered w-full text-base"
        formControlName="role"
      >
        @for (role of roles(); track role) {
          <option [value]="role">
            {{ role }}
          </option>
        }
      </select>
    </fieldset>

    <div
      class="grid col-span-3"
      [ngClass]="{
        'justify-items-center': layout === 'edit',
        'md:col-span-1 md:justify-items-start': layout === 'create',
      }"
    >
      <div class="fieldset" [ngClass]="{ 'self-center': layout === 'create' }">
        <label
          class="label cursor-pointer justify-center md:justify-start items-center gap-4"
          [ngClass]="{ 'md:mt-4': layout === 'create' }"
        >
          <span class="text-base-content text-base font-medium">Full Time</span>
          <input
            id="fullTimeCheckBox"
            type="checkbox"
            class="checkbox checkbox-lg checkbox-secondary dark:checkbox-primary"
            formControlName="fullTime"
          />
        </label>
      </div>
    </div>

    <div class="grid place-items-center col-span-3 mt-4">
      <button
        pRipple
        id="submitButton"
        type="submit"
        class="btn btn-secondary m-auto w-full md:btn-wide"
        [disabled]="isButtonDisabled() || waiting()"
      >
        {{ layout === "edit" ? "Update" : "Create" }}
      </button>
    </div>
  </form>
</div>
